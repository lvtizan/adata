<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>板块强度选股系统</title>
    <link rel="stylesheet" href="/styles-modern.css" />
  </head>
  <body data-layout="default">
    <div class="page">
      <header class="topbar">
        <h1>板块强度选股系统</h1>
        <div class="meta">
          <!-- 布局切换器 -->
          <div class="layout-switcher">
            <button class="layout-btn" data-layout="default" title="默认布局">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="1" width="4" height="14" rx="1"/>
                <rect x="6" y="1" width="5" height="14" rx="1"/>
                <rect x="12" y="1" width="3" height="14" rx="1"/>
              </svg>
            </button>
            <button class="layout-btn" data-layout="chart-focus" title="图表专注">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="1" width="3" height="14" rx="1"/>
                <rect x="5" y="1" width="3" height="14" rx="1"/>
                <rect x="9" y="1" width="6" height="14" rx="1"/>
              </svg>
            </button>
            <button class="layout-btn" data-layout="data-focus" title="数据专注">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="1" width="5" height="14" rx="1"/>
                <rect x="7" y="1" width="5" height="14" rx="1"/>
                <rect x="13" y="1" width="2" height="14" rx="1"/>
              </svg>
            </button>
            <button class="layout-btn" data-layout="balanced" title="平衡布局">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="1" y="1" width="4.5" height="14" rx="1"/>
                <rect x="6" y="1" width="4.5" height="14" rx="1"/>
                <rect x="11" y="1" width="4" height="14" rx="1"/>
              </svg>
            </button>
          </div>

          <button id="resetLayout" class="tab">重置布局</button>
          <span id="tradeDate" class="badge">-</span>
          <span id="marketLabel" class="badge">-</span>
          <span id="openLight" class="badge">-</span>
        </div>
      </header>

      <section class="cards" id="overviewCards">
        <article class="card">
          <h3>市场环境</h3>
          <div id="marketState"></div>
        </article>
        <article class="card">
          <h3>市场宽度</h3>
          <div id="breadth"></div>
        </article>
        <article class="card">
          <h3>情绪温度</h3>
          <div id="emotion"></div>
        </article>
        <article class="card">
          <h3>最强4板块</h3>
          <div id="topSectors"></div>
        </article>
      </section>

      <section class="main-grid">
        <div class="panel">
          <div class="panel-head">
            <h2>板块排行</h2>
            <div class="filter-box">
              <input id="sectorKeyword" type="text" placeholder="搜索板块..." />
            </div>
            <div class="tabs">
              <button data-sort="rps10" class="tab active">RPS</button>
              <button data-sort="5d" class="tab">5日</button>
              <button data-sort="10d" class="tab">10日</button>
            </div>
          </div>
          <div class="table-wrap">
            <table id="sectorTable">
              <thead>
                <tr>
                  <th>#</th>
                  <th>板块</th>
                  <th data-sort-col="limitUpCount">涨停</th>
                  <th data-sort-col="rps10">RPS10</th>
                  <th data-sort-col="pctChange5d">5日%</th>
                  <th data-sort-col="pctChange10d">10日%</th>
                  <th data-sort-col="amount">成交额</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="col-resizer" id="resizerLeft" title="拖动调整"></div>

        <div class="panel">
          <div class="panel-head">
            <h2>板块内强股</h2>
          </div>
          <div class="table-wrap">
            <table id="stockTable">
              <thead>
                <tr>
                  <th>名称</th>
                  <th data-sort-col="rps20">RPS20</th>
                  <th data-sort-col="pctChange5d">5日%</th>
                  <th data-sort-col="pctChange10d">10日%</th>
                  <th data-sort-col="amount">成交额</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="col-resizer" id="resizerRight" title="拖动调整"></div>

        <div class="panel chart-panel">
          <div class="chart-card">
            <h3 id="sectorChartTitle">细分板块K线</h3>
            <div class="draw-tools">
              <button id="sectorToolCursor" class="tool-btn active" title="指针">⌖</button>
              <button id="sectorToolLine" class="tool-btn" title="趋势线">／</button>
              <button id="sectorDrawClear" class="tool-btn" title="清空">🗑</button>
            </div>
            <div id="sectorChart" class="chart"></div>
          </div>
          <div class="chart-card">
            <h3 id="stockChartTitle">个股K线</h3>
            <div class="draw-tools">
              <button id="stockToolCursor" class="tool-btn active" title="指针">⌖</button>
              <button id="stockToolLine" class="tool-btn" title="趋势线">／</button>
              <button id="stockDrawClear" class="tool-btn" title="清空">🗑</button>
            </div>
            <div id="stockChart" class="chart"></div>
          </div>
          <div class="chart-card">
            <h3>个股 vs 板块强弱</h3>
            <div id="rsSummary" class="summary"></div>
            <div id="rsChart" class="chart"></div>
          </div>
        </div>
      </section>
    </div>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <div id="layoutHint" class="layout-hint"></div>
    <div id="miniKTooltip" class="mini-k-tooltip">
      <div class="mini-k-title" id="miniKTitle">-</div>
      <div id="miniKChart" class="mini-k-chart"></div>
    </div>
    <script src="/app.js"></script>
    <script>
      // 布局切换功能
      document.addEventListener('DOMContentLoaded', () => {
        const layoutBtns = document.querySelectorAll('.layout-btn');
        const body = document.body;

        // 从localStorage恢复布局
        const savedLayout = localStorage.getItem('sector-layout-mode');
        if (savedLayout) {
          body.setAttribute('data-layout', savedLayout);
          updateActiveLayoutBtn(savedLayout);
        }

        layoutBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const layout = btn.getAttribute('data-layout');
            body.setAttribute('data-layout', layout);
            localStorage.setItem('sector-layout-mode', layout);
            updateActiveLayoutBtn(layout);

            // 触发图表重绘
            setTimeout(() => {
              window.dispatchEvent(new Event('resize'));
            }, 100);
          });
        });

        function updateActiveLayoutBtn(activeLayout) {
          layoutBtns.forEach(btn => {
            if (btn.getAttribute('data-layout') === activeLayout) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }

        // 添加布局切换按钮样式
        const style = document.createElement('style');
        style.textContent = `
          .layout-switcher {
            display: flex;
            gap: 6px;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--line);
          }

          .layout-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--sub);
            transition: all 0.2s ease;
          }

          .layout-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
          }

          .layout-btn.active {
            background: var(--primary);
            color: white;
          }

          @media (max-width: 899px) {
            .layout-switcher {
              order: -1;
              width: 100%;
            }
          }
        `;
        document.head.appendChild(style);
      });
    </script>
  </body>
</html>
