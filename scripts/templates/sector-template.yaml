# ─── 使用说明 ───────────────────────────────────────
# upstream/downstream 中的 code 如果是 A 股公司就填 ts_code
# 如果是海外公司（英伟达、苹果等）code 留空即可
# one_liner 控制在 30 字以内，是股票列表里最核心的一句话
